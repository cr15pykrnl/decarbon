[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decarbon-demo"
version = "0.1.0"
description = "Exploratory synthetic fleet decarbonisation calculations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Digital Twin Team"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4,<5", "pandas>=2,<3", "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1", "plotly>=5,<7", "scipy>=1.11,<2",
]

[project.urls]
Publication = "https://doi.org/10.1142/S0218348X26400633"
Repository = "https://github.com/cr15pykrnl/decarbon"

[tool.setuptools]
packages = ["digital_twin"]
